<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E2620" />
    <title>No connection | The R.H.T App</title>
    <style>
      /* Self-contained: this page is shown when nothing else can be loaded. */
      html { background: #0e2620; color: #f1ebdd; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
      main { max-width: 28rem; }
      h1 { font-family: 'Bodoni Moda', Didot, 'Bodoni MT', Georgia, serif; font-weight: 400; font-size: 2.441rem; line-height: 1.1; margin: 0 0 12px; }
      p { color: #9fb3a8; line-height: 1.5; margin: 0 0 24px; }
      a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 24px; border: 1px solid #c8a662; border-radius: 999px; color: #c8a662; text-decoration: none; font-size: 0.875rem; font-weight: 500; }
      a:focus-visible { outline: 2px solid #c8a662; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>No connection</h1>
      <p>This app needs the internet to load your data. Nothing has been lost. Check your connection, then try again.</p>
      <a href="/today">Try again</a>
    </main>
  </body>
</html>
